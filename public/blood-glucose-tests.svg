<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Three ways to assess blood glucose</title><desc id="desc">An educational diagram comparing fasting plasma glucose, HbA1c and the oral glucose tolerance test. It does not represent patient measurements.</desc><rect width="1200" height="630" fill="#10272a"/><text x="68" y="100" font-family="Arial,sans-serif" font-size="49" font-weight="700" fill="#f4f8f4">Beyond a single glucose reading</text><text x="68" y="148" font-family="Arial,sans-serif" font-size="24" fill="#bad6d2">Three clinical tests answer different questions</text><g font-family="Arial,sans-serif"><rect x="68" y="200" width="333" height="310" rx="20" fill="#204449"/><rect x="433" y="200" width="333" height="310" rx="20" fill="#204449"/><rect x="798" y="200" width="333" height="310" rx="20" fill="#204449"/><text x="93" y="261" font-size="29" font-weight="700" fill="#e8faf2">Fasting glucose</text><text x="458" y="261" font-size="29" font-weight="700" fill="#e8faf2">HbA1c</text><text x="823" y="261" font-size="29" font-weight="700" fill="#e8faf2">Glucose tolerance</text><path d="M105 341 H362" stroke="#91c7bd" stroke-width="4" stroke-linecap="round"/><circle cx="231" cy="341" r="13" fill="#f4c879"/><path d="M470 373 C510 360 560 350 601 341 S690 319 729 310" stroke="#f4c879" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M838 394 C876 393 897 298 943 293 S1027 387 1094 350" stroke="#8ad7c8" stroke-width="6" fill="none" stroke-linecap="round"/><text x="93" y="441" font-size="23" fill="#e1eae6">One point in time</text><text x="458" y="441" font-size="23" fill="#e1eae6">Longer-term average</text><text x="823" y="441" font-size="23" fill="#e1eae6">Response to a glucose load</text><text x="68" y="566" font-size="21" fill="#bad6d2">Conceptual illustration only — not diagnostic curves, thresholds or patient data.</text></g></svg>